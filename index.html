<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS Calculator - OOP & TDD</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .calculator { background: #333; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 320px; }
        #display { width: 100%; height: 60px; background: #eee; border: none; margin-bottom: 20px; text-align: right; padding: 10px; font-size: 2rem; border-radius: 8px; box-sizing: border-box; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 20px; font-size: 1.2rem; border: none; border-radius: 8px; cursor: pointer; background: #555; color: white; transition: 0.2s; }
        button:hover { background: #777; }
        .operator { background: #f39c12; }
        .operator:hover { background: #e67e22; }
        .equal { background: #27ae60; grid-column: span 2; }
        .equal:hover { background: #2ecc71; }
        .clear { background: #c0392b; }
        .clear:hover { background: #e74c3c; }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" id="clear">C</button>
            <button class="operator" id="backspace">⌫</button> 
            <button class="operator btn-input">/</button>
            <button class="operator btn-input">*</button>
            <button class="operator btn-input">-</button>
            
            <button class="btn-input">7</button>
            <button class="btn-input">8</button>
            <button class="btn-input">9</button>
            <button class="operator btn-input">+</button>
            
            <button class="btn-input">4</button>
            <button class="btn-input">5</button>
            <button class="btn-input">6</button>
            <button class="btn-input">.</button>
            
            <button class="btn-input">1</button>
            <button class="btn-input">2</button>
            <button class="btn-input">3</button>
            <button class="btn-input">0</button>
            
            <button class="equal" id="calculate">=</button>
        </div>
    </div>
<script type="module" src="./dist/src/ui.js"></script></body>
</html>
